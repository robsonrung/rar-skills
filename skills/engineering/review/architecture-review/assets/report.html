<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>@@TITLE@@</title>
<style>
:root{--ink:#182c3e;--muted:#526377;--paper:#f3f6f8;--panel:#fff;--line:#d9e2e8;--nav:#14293b;--teal:#087d75;--blue:#2363a0;--amber:#946015;--red:#a82b35;--radius:15px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:26px}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c0820a;outline-offset:4px}button,input,select{font:inherit}button{cursor:pointer}h1,h2,h3,h4,p{margin-top:0}h1{font-size:clamp(32px,3.1vw,51px);line-height:1.13;letter-spacing:-1.5px;max-width:850px;margin-bottom:20px}h2{font-size:27px;line-height:1.3;letter-spacing:-.6px;margin-bottom:12px}h3{font-size:19px;line-height:1.4;margin-bottom:12px}h4{font-size:14px;margin:18px 0 6px}p{margin-bottom:14px}small,.small{font-size:13px}.muted{color:var(--muted)}.mono,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86em}code{overflow-wrap:anywhere}.skip{position:fixed;top:-100px;left:20px;z-index:10;background:white;padding:12px}.skip:focus{top:12px}.sidebar{width:238px;position:fixed;inset:0 auto 0 0;background:var(--nav);color:#f1f6fa;padding:30px 22px;overflow-y:auto}.brand{font-size:19px;line-height:1.35;font-weight:750;letter-spacing:-.5px}.brand span{display:block;color:#8fc6c5;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.nav-note{font-size:12px;color:#b8c8d6;border-top:1px solid #365063;padding-top:18px;margin-top:24px}.sidebar nav{display:grid;gap:4px;margin-top:30px}.sidebar nav a{color:#cad9e4;text-decoration:none;padding:9px 11px;border-radius:6px;font-size:13px}.sidebar nav a:hover{background:#264154;color:#fff}.nav-num{color:#7aa8b5;margin-right:12px;font-size:11px}.workspace{margin-left:238px;padding:32px 42px 72px;max-width:1770px}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px;color:var(--muted);margin-bottom:22px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:650;line-height:1.5;background:#fff;white-space:nowrap}.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px 38px;margin-bottom:22px;border-top:5px solid var(--teal)}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:2px;color:var(--teal);margin-bottom:14px}.lead{font-size:18px;line-height:1.65;max-width:970px;color:#455a6c}.demo-banner{background:#fff5d9;border:1px solid #e6cd8c;color:#684610;padding:12px 17px;border-radius:8px;font-size:13px;margin:0 0 22px}.verdict-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--line);padding-top:23px;margin-top:26px}.verdict-grid .label{font-size:11px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.verdict-grid p{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 28px}.stat{padding:18px 21px;background:white;border:1px solid var(--line);border-radius:12px}.stat strong{font-size:31px;line-height:1.25;display:block;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}section{margin:42px 0 0;scroll-margin-top:26px}.section-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}.section-no{display:grid;place-items:center;flex:0 0 39px;height:39px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--teal)}.section-head p{font-size:14px;color:var(--muted);margin:0;max-width:900px}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:16px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2>.panel,.grid3>.panel{margin:0}.context-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.context-item{background:#fff;border:1px solid var(--line);padding:17px 19px;border-radius:10px}.context-item h3{font-size:12px;color:var(--muted);margin:0 0 8px}.context-item p{font-size:15px;margin:0 0 10px}.refs{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:9px}.refs a{font-size:10px;font-family:ui-monospace,monospace;padding:2px 6px;background:#edf3f7;border:1px solid #d7e4ec;border-radius:4px;text-decoration:none}.tag{font-size:10px;font-weight:750;border-radius:5px;padding:4px 7px;line-height:1.4;display:inline-block;background:#edf1f5;color:#475b6d}.tag.adequate,.tag.pass,.tag.verified{color:#085d48;background:#e1f2e9}.tag.attention,.tag.P2,.tag.proposed,.tag.conditional{color:#754e12;background:#fff0cf}.tag.critical,.tag.P0,.tag.P1,.tag.fail,.tag.failed{color:#8e2634;background:#fce5e8}.tag.unknown,.tag.not_run,.tag.blocked{color:#586572;background:#edf1f5}.tag.not_applicable{color:#586572;background:#f4f5f6}.tag.recommended{color:#075d57;background:#dff2ee}.card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.card-top .id{font-size:11px;color:var(--muted);margin-right:auto}.dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dimension{background:white;border:1px solid var(--line);border-left:4px solid #a4b1bd;padding:19px 20px;border-radius:9px}.dimension.adequate{border-left-color:var(--teal)}.dimension.attention{border-left-color:#cc942f}.dimension.critical{border-left-color:var(--red)}.dimension h3{font-size:16px;margin-bottom:8px}.dimension p{font-size:13px;color:var(--muted);margin:0}.quality-bar{display:flex;width:100%;height:12px;overflow:hidden;border-radius:10px;margin:16px 0}.quality-bar span.adequate{background:#087d75}.quality-bar span.attention{background:#d9a53d}.quality-bar span.critical{background:#b9404b}.quality-bar span.unknown{background:#a8b4c0}.quality-bar span.not_applicable{background:#dfe4e9}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;margin:20px 0}.toolbar label{font-size:12px;font-weight:650}.toolbar input{min-width:0;flex:1;background:#fff;border:1px solid #becbd5;border-radius:8px;padding:10px 12px}.toolbar select{background:#fff;border:1px solid #becbd5;border-radius:8px;padding:9px;max-width:210px}.button{border:1px solid #c2cfd8;border-radius:7px;padding:7px 12px;background:#fff;color:var(--ink);font-size:12px}.diagram{margin:18px 0;border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden}.diagram-header{padding:22px 25px 12px}.diagram-header h3{margin:8px 0}.diagram-header p{font-size:14px;color:var(--muted);margin:0}.diagram-scroll{overflow-x:auto;background:linear-gradient(#fbfcfd,#f5f8fa);border-top:1px solid #e5ebf0;border-bottom:1px solid #e5ebf0;padding:15px 18px}.diagram svg{display:block;width:100%;min-width:650px;height:auto}.diagram-footer{padding:15px 25px}.diagram-footer p{font-size:12px;margin:7px 0}.diagram svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.diagram svg .node-title{font-size:16px;font-weight:700;fill:#193247}.diagram svg .node-detail{font-size:12px;fill:#506273}.diagram svg .edge-label{font-size:11px;font-weight:650;fill:#40586c}.diagram svg .node-id{font-size:9px;letter-spacing:1px;fill:#647b8c}details{margin:12px 0}summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--blue);padding:5px 0}details[open]>summary{margin-bottom:13px}.finding{border-left:4px solid #d9a53d}.finding.P0,.finding.P1{border-left-color:#ba3a48}.finding .impact{background:#f6f8fa;border-radius:8px;padding:13px 16px;font-size:14px}.finding p{font-size:14px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 30px}.detail-grid p{font-size:13px}.detail-grid h4{font-size:12px;color:var(--muted)}.option{border-top:4px solid #bcc8d1}.option.recommended{border-top-color:var(--teal)}.option p,.option li{font-size:13px}.option h3{margin-top:12px}ul{padding-left:20px;margin:8px 0 14px}li{margin:5px 0}.roadmap{border-left:2px solid #b9d1d5;margin-left:12px;padding-left:27px}.step{position:relative;margin:18px 0;background:white;padding:22px;border:1px solid var(--line);border-radius:11px}.step:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--teal);left:-35px;top:29px;border:3px solid var(--paper)}.step p,.step li{font-size:13px}.step h3{margin:8px 0}.table-wrap{overflow-x:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);background:#f4f7fa}th,td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}td{overflow-wrap:anywhere}table .refs{margin-top:5px}.table-wrap table{min-width:570px}.evidence{border-top:1px solid var(--line);padding-top:17px;margin-top:20px}.evidence h3{font-size:15px}.evidence p{font-size:13px}.location{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.source h3{font-size:14px;margin-bottom:5px}.source p{font-size:12px;margin-bottom:7px}.source+.source{border-top:1px solid var(--line);padding-top:17px;margin-top:17px}.glossary{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px}.glossary dt{font-size:13px;font-weight:700}.glossary dd{font-size:13px;color:var(--muted);margin:3px 0 14px}.empty{font-size:14px;color:var(--muted);padding:12px 0}.footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:42px;padding-top:18px}.confidence{font-size:11px;color:var(--muted)}[hidden]{display:none!important}.noscript{background:#fff0cf;padding:12px;font-size:13px}
@media(max-width:1150px){.workspace{padding:24px 25px 60px}.sidebar{width:208px;padding:25px 16px}.workspace{margin-left:208px}.grid3,.context-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:30px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){html{scroll-padding-top:12px}.sidebar{position:relative;width:100%;height:auto;padding:18px 20px}.brand{font-size:17px}.brand span{font-size:9px;margin-bottom:3px}.sidebar nav{display:flex;overflow-x:auto;gap:3px;margin-top:14px}.sidebar nav a{white-space:nowrap;font-size:11px;padding:6px 9px}.sidebar .nav-note{display:none}.workspace{margin:0;padding:20px 16px 48px}.hero{padding:25px 21px}.hero h1{font-size:33px;letter-spacing:-1px}.lead{font-size:16px}.verdict-grid,.grid2,.grid3,.context-grid,.dim-grid,.detail-grid,.glossary{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:27px}.topline{font-size:10px;align-items:flex-start}.section-head{gap:11px}.section-head h2{font-size:24px}.section-head p{font-size:13px}.panel{padding:19px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:70%}.toolbar select{flex:1;max-width:none}.diagram-header,.diagram-footer{padding-left:18px;padding-right:18px}section{margin-top:32px}.diagram svg{min-width:650px}.roadmap{padding-left:20px}.step:before{left:-28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{@page{margin:14mm}body{font:10pt/1.45 sans-serif;background:#fff}.sidebar,.toolbar,.button,.skip,.topline .pill,.noscript{display:none!important}.workspace{margin:0;padding:0;max-width:none}.hero{padding:20px;border:1px solid #ccc;break-inside:avoid}h1{font-size:25pt}h2{font-size:18pt}h3{font-size:13pt}.lead{font-size:12pt}.panel,.dimension,.step,.context-item,.stat{box-shadow:none;break-inside:avoid}.diagram{break-inside:avoid}.diagram svg{min-width:0}.diagram-scroll{overflow:visible;padding:5px}.table-wrap{overflow:visible}.table-wrap table{min-width:0}.grid3{grid-template-columns:repeat(2,1fr)}.dim-grid{grid-template-columns:1fr 1fr}.refs a{text-decoration:none}a{color:inherit}section{margin-top:24px}.demo-banner{break-inside:avoid}.stats{grid-template-columns:repeat(4,1fr)}.legend{font-size:9pt}}
</style>
</head>
<body>
<a class="skip" href="#main">@@SKIP@@</a>
<aside class="sidebar"><div class="brand"><span>Architecture Review</span>@@BRAND@@</div><nav aria-label="@@NAVLABEL@@">@@NAV@@</nav><p class="nav-note">@@NAVNOTE@@</p></aside>
<main id="main" class="workspace">
<div class="topline"><span>@@META@@</span><button class="button" id="print-button" type="button">@@PRINT@@</button></div>
@@DEMO@@
<noscript><p class="noscript">@@NOSCRIPT@@</p></noscript>
@@CONTENT@@
<footer class="footer">@@FOOTER@@</footer>
</main>
<script>
(()=>{'use strict';
 const search=document.getElementById('report-search');
 const priority=document.getElementById('priority-filter');
 const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 function apply(){const q=normalize(search.value.trim()),p=priority.value;let n=0;
 document.querySelectorAll('.searchable').forEach(el=>{const found=!q||normalize(el.textContent).includes(q);const ok=!el.dataset.priority||p==='all'||el.dataset.priority===p;el.hidden=!(found&&ok);if(el.classList.contains('finding')&&!el.hidden)n++;});
 document.getElementById('filter-count').textContent=String(n);}
 if(search&&priority){search.addEventListener('input',apply);priority.addEventListener('change',apply);}
 document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);const target=document.getElementById(id);if(!target)return;target.hidden=false;let d=target.closest('details');while(d){d.open=true;d=d.parentElement.closest('details');}});
 let printState=[];let hiddenState=[];
 window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true);hiddenState=[...document.querySelectorAll('[hidden]')];hiddenState.forEach(e=>e.hidden=false);});
 window.addEventListener('afterprint',()=>{printState.forEach(([d,open])=>d.open=open);hiddenState.forEach(e=>e.hidden=true);});
 document.getElementById('print-button').addEventListener('click',()=>window.print());
})();
</script>
</body>
</html>
