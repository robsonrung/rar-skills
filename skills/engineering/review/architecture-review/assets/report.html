<body>
<a class="skip" href="#main">@@SKIP@@</a>
<aside class="sidebar"><div class="brand"><span>Architecture Review</span>@@BRAND@@</div><nav aria-label="@@NAVLABEL@@">@@NAV@@</nav><p class="nav-note">@@NAVNOTE@@</p></aside>
<main id="main" class="workspace">
<div class="topline"><span>@@META@@</span><!--PRINT--><button class="button" id="print-button" type="button">@@PRINT@@</button><!--/PRINT--></div>
@@DEMO@@
<noscript><p class="noscript">@@NOSCRIPT@@</p></noscript>
@@CONTENT@@
<footer class="footer">@@FOOTER@@</footer>
</main>
<script>
(()=>{'use strict';
 const search=document.getElementById('report-search');
 const priority=document.getElementById('priority-filter');
 const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 function apply(){const q=normalize(search.value.trim()),p=priority.value;let n=0;
 document.querySelectorAll('.searchable').forEach(el=>{const found=!q||normalize(el.textContent).includes(q);const ok=!el.dataset.priority||p==='all'||el.dataset.priority===p;el.hidden=!(found&&ok);if(el.classList.contains('finding')&&!el.hidden)n++;});
 document.getElementById('filter-count').textContent=String(n);}
 if(search&&priority){search.addEventListener('input',apply);priority.addEventListener('change',apply);}
 document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);const target=document.getElementById(id);if(!target)return;target.hidden=false;let d=target.closest('details');while(d){d.open=true;d=d.parentElement.closest('details');}});
/*PRINT*/ let printState=[];let hiddenState=[];
 window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true);hiddenState=[...document.querySelectorAll('[hidden]')];hiddenState.forEach(e=>e.hidden=false);});
 window.addEventListener('afterprint',()=>{printState.forEach(([d,open])=>d.open=open);hiddenState.forEach(e=>e.hidden=true);});
 document.getElementById('print-button').addEventListener('click',()=>window.print());/*/PRINT*/
})();
</script>
</body>
