interface:
  display_name: "Implement Tasks"
  short_description: "Approve models, execute the approved queue, and verify"
  default_prompt: "Use $implement-tasks on the approved queue. Present exact implementation, independent review, and integration models, effort levels, native capability checks, transport, and role-session strategy for my approval before dispatch unless the same plan is already approved. Use a fresh task-scoped implementer and reviewer pair for each task, retain each pair through permitted fixes and evidence recovery, and use a separate integration context. Then run implement-and-review per task, integrate dependencies, verify acceptance, and review the seams. Keep delivery within my authorization."
policy:
  allow_implicit_invocation: false
