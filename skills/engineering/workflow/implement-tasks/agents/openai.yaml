interface:
  display_name: "Implement Tasks"
  short_description: "Approve models, execute the approved queue, and verify"
  default_prompt: "Use $implement-tasks on the canonical queue. Reuse exact task and model approval when it exists. For a combined decision, present the concrete queue and resolved routes together and record one actual response as two distinct gates. Before dispatch, verify hashes, capabilities, privacy, receipts, tools, ownership, and budgets. Use the read-only queue controller for readiness. Keep a separate implementer and independent reviewer per task and a separate integration context. Run implement-and-review, verify the combined state before releasing dependents, and keep delivery within my authorization."
policy:
  allow_implicit_invocation: false
