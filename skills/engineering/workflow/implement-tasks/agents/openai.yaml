interface:
  display_name: "Implement Tasks"
  short_description: "Approve models, execute the approved queue, and verify"
  default_prompt: "Use $implement-tasks on the approved queue. Show the model plan and wait for approval unless an exact approval exists. Schedule ready tasks from tasks.md, run each through implement-and-review, release dependents only on captured checks of the combined source, verify the combined change, and keep delivery within my authorization."
policy:
  allow_implicit_invocation: false
