interface:
  display_name: "Pre-PR Review"
  short_description: "Check review evidence and complete missing work before a PR"
  default_prompt: "Use $pre-pr-review to check existing task and integration evidence against the current change. Complete only missing reviews, fixes, and checks. Run an independent review when review evidence is missing. Simplify only for a concrete need. Keep the result local."
policy:
  allow_implicit_invocation: false
