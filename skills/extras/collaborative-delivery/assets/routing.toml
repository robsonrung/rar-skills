# Panel routing for `collaborative-delivery` (panel gates are mandatory here).
#
# This is a ChatGPT or Codex host default from
# `shared/references/model-roster.md`. An approved plan binds every role to the
# active host, exact model, effort, and model-verification policy before it
# starts. In a Claude host, bind Fable or Opus to native delegation before the
# phase. A failed native route never switches to a runner automatically.

[skill]
name = "collaborative-delivery"
artifact_dir = ".ai-workflow/panel/delivery"
mandatory_presence = ["synthesis_anchor", "adversarial_anchor"]
required_phases = ["task_intake", "red", "green", "refactor", "review", "verification", "handoff"]
required_outputs = ["execution_log.md", "test_evidence.md", "review_notes.md", "changed_files.md", "decision_log.md", "panel_summary.json"]
workflow = "Follow the skill SKILL.md instructions, resolve each exact route through host-model-execution before dispatch, keep one context per task and role, preserve disagreements in the decision log, and do not mark the phase complete until every listed role has a real response and mandatory anchor roles are recorded."

[providers.synthesis_anchor]
route = "hard-implementation"
family = "gpt"
route_role = "implementer"
kind = "native"
host = "chatgpt-or-codex"
session_policy = "per-role-persistent"
enabled = true
native_response_required = true
duty = "Synthesize, reconcile, coordinate the host-native role when allowed, and own final decisions for a normal repository change."

[providers.adversarial_anchor]
route = "precision-review"
family = "claude"
route_role = "reviewer"
kind = "runner"
session_policy = "per-role-persistent"
enabled = true
script = ".agents/skills/claude-runner/scripts/run_claude.py"
timeout_seconds = 1200
duty = "Run the independent precision pass for subtle semantics, high-impact claims, and evidence quality. Check exact adapter support before approval."
runner_args = ["--output-format", "json", "--restrict-tools"]

[providers.design_analysis]
route = "architecture"
family = "claude"
route_role = "worker"
kind = "runner"
session_policy = "per-role-persistent"
enabled = true
script = ".agents/skills/claude-runner/scripts/run_claude.py"
timeout_seconds = 1200
duty = "Analyze architecture, design, delivery trade-offs, and unresolved reasoning chains. This is not the default broad code review."
runner_args = ["--output-format", "json", "--restrict-tools"]

[providers.test_driver]
route = "test-design"
family = "gpt"
route_role = "worker"
kind = "native"
host = "chatgpt-or-codex"
session_policy = "per-role-persistent"
enabled = true
native_response_required = true
duty = "Drive TDD, failure-mode tests, and red-green-refactor evidence."

[providers.broad_review]
route = "independent-review"
family = "gpt"
route_role = "reviewer"
kind = "native"
host = "chatgpt-or-codex"
session_policy = "per-role-persistent"
enabled = true
native_response_required = true
duty = "Run the independent broad code pass when Astra is the implementation route."

[roles.synthesis_anchor]
provider = "synthesis_anchor"
runner_role = "synthesizer"
duty = "Synthesis, final reconciliation, implementation-aware decisions, and audit trail ownership."

[roles.adversarial_anchor]
provider = "adversarial_anchor"
runner_role = "adversarial"
duty = "Independent precision critique for subtle semantics, edge cases, evidence gaps, and blocking objections."

[roles.implementation]
provider = "synthesis_anchor"
runner_role = "implementer"
duty = "Apply the smallest correct change that satisfies the current task and preserves architecture boundaries."

[roles.interface]
provider = "design_analysis"
runner_role = "codereviewer"
duty = "For user interface work, analyze component contracts, states, accessibility, responsiveness, and user experience behavior."

[roles.backend]
provider = "synthesis_anchor"
runner_role = "implementer"
duty = "For service work, implement use cases, domain behavior, ports, adapters, permissions, persistence, and observability with tests first."

[roles.testing]
provider = "test_driver"
runner_role = "planner"
duty = "Drive red, green, refactor. Add regression tests before fixes and validate behavior with the narrowest reliable command first."

[roles.review]
provider = "broad_review"
runner_role = "codereviewer"
duty = "Run the independent broad review for correctness, error paths, data safety, and architectural fit before completion."

[roles.simplification]
provider = "adversarial_anchor"
runner_role = "challenger"
duty = "Remove accidental complexity after tests pass. Prefer clear names, smaller seams, and fewer abstractions."

[roles.delivery_review]
provider = "design_analysis"
runner_role = "codereviewer"
duty = "Analyze delivery risk, sequencing, hidden coupling, rollout impact, and whether the current slice remains safe to ship."

[phases.task_intake]
roles = ["synthesis_anchor", "adversarial_anchor", "implementation", "testing", "delivery_review"]

[phases.red]
roles = ["synthesis_anchor", "adversarial_anchor", "testing"]

[phases.green]
roles = ["synthesis_anchor", "adversarial_anchor", "implementation", "testing"]

[phases.refactor]
roles = ["synthesis_anchor", "adversarial_anchor", "simplification", "testing"]

[phases.review]
roles = ["synthesis_anchor", "adversarial_anchor", "review", "delivery_review"]

[phases.verification]
roles = ["synthesis_anchor", "adversarial_anchor", "testing", "review"]

[phases.handoff]
roles = ["synthesis_anchor", "adversarial_anchor", "delivery_review"]
