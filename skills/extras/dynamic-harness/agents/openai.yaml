# Codex agent interface metadata; consumed by the Codex host, not read at runtime by the model.
interface:
  display_name: "Dynamic Harness"
  short_description: "Run dynamic multi agent orchestration and thin manager mission control"
  default_prompt: "Use $dynamic-harness to design and run a dynamic multi agent harness for this complex task, choosing the right pattern and synthesizing verified results; in manager mode, keep a mission ledger, discover native subagent tools, spawn bounded workers when useful, and preserve context with compact handoffs."
policy:
  allow_implicit_invocation: false
