# Codex agent interface metadata; consumed by the Codex host, not read at runtime by the model.
interface:
  display_name: "Explain Architecture"
  short_description: "HTML orientation page for a codebase: map, layers, one flow, where to look next"
  default_prompt: "Use $explain-architecture to build a self-contained HTML orientation page for this codebase or subsystem — clickable component map, layers and seams, one flow traced end-to-end with file:line evidence, and where to look next — tuned to the audience. Explain, do not judge."
policy:
  allow_implicit_invocation: false
