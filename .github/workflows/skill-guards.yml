name: skill guards

# Mechanical guards for the skill repo (see the "right-size guards" rule:
# if it needs an LLM to judge, it's not a CI test).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests for every skill that ships them
        run: |
          set -e
          for dir in $(find skills -type d -name tests -not -path '*/__pycache__/*' | sort); do
            ls "$dir"/test_*.py >/dev/null 2>&1 || continue
            echo "::group::$dir"
            python3 -m unittest discover -s "$dir" -t "$dir"
            echo "::endgroup::"
          done
      - name: Architecture review contract, measurements and renderer
        run: |
          python3 skills/engineering/review/architecture-review/scripts/selftest.py
          python3 skills/engineering/review/architecture-review/scripts/validate_report.py skills/engineering/review/architecture-review/examples/demo-audit.json
      - name: Skill frontmatter, runner registration, and leitwörter
        run: |
          python3 skills/shared/scripts/validate_skill_frontmatter.py
          python3 scripts/check_leitworter.py
      - name: Command guard denylist
        run: skills/shared/hooks/test-guard.sh
