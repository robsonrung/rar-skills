# Optional per-checkout preferences used only while building a model preview.
# Copy to .rar-skills/config.local.yaml (gitignored). Every key is optional.
# A direct user instruction wins. This file never changes an approved route.
#
# Use known seat ids from shared/model-routing.json.
# Do not put credentials, runner paths, command flags, or effort overrides here.

profile: saver  # Select a central profile, such as saver, economy, or balanced.

seats:
  preferred: []  # Example: [astra, fable, gemini]
  excluded: []   # Example: [glm]

# Per-route role changes applied while forming a preview, never after approval.
# Shape: route id -> role -> SEAT[:EFFORT] (use runtime for null effort).
