# Codex agent interface metadata; consumed by the Codex host, not read at runtime by the model.
interface:
  display_name: "Diverse Plan"
  short_description: "Plan one change via parallel multi model branches merged into one plan"
  default_prompt: "Use $diverse-plan to explore genuinely different approaches to this change in parallel across multiple models, pressure-test each, and merge the best of all branches into one enriched plan (a plan, not code)."
policy:
  allow_implicit_invocation: false
