# Panel-mode routing for `brainstorm` (opt-in; see SKILL.md "Panel mode").
#
# Model ids come from `_shared/references/model-roster.md` — update the roster
# first, then this file. Role names are what SKILL.md refers to; the seat behind
# each role is editable here without touching the workflow.

[skill]
name = "brainstorm"
artifact_dir = ".codex_workflow/brainstorm"
mandatory_presence = ["synthesis_anchor", "adversarial_anchor"]
# Phase order is authoritative in SKILL.md; this list must match it. The validator checks set membership only.
required_phases = ["divergence", "cross_critique"]
required_outputs = ["discovery_brief.md", "option_map.md", "open_questions.md", "decision_log.md", "panel_summary.json"]
workflow = "Follow the skill SKILL.md instructions, keep role outputs independent before reconciliation, preserve disagreements in the decision log, and do not mark the phase complete until every listed role has a real response and mandatory anchor roles are recorded."

[providers.synthesis_anchor]
kind = "runner"
runner = "claude"
provider = "anthropic"
model = "opus"
model_label = "Opus"
enabled = true
script = ".agents/skills/claude-runner/scripts/run_claude.py"
timeout_seconds = 1200
duty = "Synthesize ambiguous options, reconcile product and architecture judgment, and own the final recommendation."
runner_args = ["--output-format", "json", "--no-session-persistence", "--restrict-tools", "--effort", "high"]

[providers.adversarial_anchor]
kind = "native_codex"
provider = "codex"
model = "gpt-5.6-sol"
model_label = "GPT 5.6 Sol"
enabled = true
native_response_required = true
duty = "Challenge assumptions against explicit constraints, find execution and security risks, and block unsupported convergence."

[providers.broad_context]
kind = "runner"
runner = "gemini"
provider = "google"
model = "gemini-3.7-flash"
model_label = "Gemini 3.7 Flash"
enabled = true
script = ".agents/skills/gemini-runner/scripts/run_gemini.py"
timeout_seconds = 1200
duty = "Explore broad context, user journeys, interface options, large code context, and alternative scenarios."
runner_args = ["--output-format", "json"]

[providers.feasibility]
kind = "runner"
runner = "kimi"
provider = "moonshot"
model = "moonshotai/kimi-k3"
model_label = "Kimi K3"
enabled = true
script = ".agents/skills/kimi-runner/scripts/run_kimi.py"
timeout_seconds = 1200
duty = "Pressure test execution feasibility, sequencing, long horizon integration, and implementation risks."
# `--data-dir` isolates cline state so a panel run never rewrites the interactive
# user's ~/.cline provider default. Provision auth in that directory once.
# `--no-session-persistence` is a documented no-op on cline, and `--restrict-tools`
# is already the default for every non-implementer role, so neither is passed.
runner_args = ["--output-format", "stream-json", "--data-dir", "/tmp/cline-panel-state"]

[roles.synthesis_anchor]
provider = "synthesis_anchor"
runner_role = "synthesizer"
duty = "Final synthesis, reconciliation of ambiguous options, implementation aware judgment, and audit trail ownership."

[roles.adversarial_anchor]
provider = "adversarial_anchor"
runner_role = "adversarial"
duty = "Adversarial critique, architecture risk, security risk, data safety, edge cases, and blocking objections."

[roles.broad_context]
provider = "broad_context"
runner_role = "researcher"
duty = "Explore adjacent solutions, alternative product shapes, edge cases, and prior art. Do not converge too early."

[roles.feasibility]
provider = "feasibility"
runner_role = "planner"
duty = "Evaluate technical feasibility, integration pressure, sequencing risk, and hidden operational cost."

[roles.user_advocate]
provider = "broad_context"
runner_role = "planner"
duty = "Represent user value, usability, accessibility, onboarding, and support burden."

[phases.divergence]
roles = ["synthesis_anchor", "adversarial_anchor", "broad_context", "user_advocate", "feasibility"]

[phases.cross_critique]
roles = ["synthesis_anchor", "adversarial_anchor", "broad_context", "user_advocate", "feasibility"]
