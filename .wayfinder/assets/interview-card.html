<!doctype html>
<meta charset="utf-8">
<title>prototype — the interview card</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --paper:#eaeef4; --surface:#f7f9fc; --surface2:#eff3f8;
    --ink:#131c27; --ink-soft:#46566a; --ink-faint:#55677c;
    --rule:#c6d0dd; --rule-soft:#dbe3ec;
    --human:#8a5a10; --auto:#12604f; --gate:#94293e; --accent:#1c587f;
    --human-wash:rgba(154,101,18,.09); --auto-wash:rgba(18,96,79,.08);
    --gate-wash:rgba(148,41,62,.08); --accent-wash:rgba(28,88,127,.08);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0d151f; --surface:#131e2a; --surface2:#16222f;
      --ink:#dfe7f0; --ink-soft:#9db0c4; --ink-faint:#7c8fa4;
      --rule:#24344a; --rule-soft:#1b2938;
      --human:#e0a442; --auto:#4fc4ac; --gate:#e2758c; --accent:#6cb6e8;
      --human-wash:rgba(224,164,66,.10); --auto-wash:rgba(79,196,172,.09);
      --gate-wash:rgba(226,117,140,.10); --accent-wash:rgba(108,182,232,.10);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5}

  header{padding:16px 24px 12px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0}
  header .board{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
  .switch{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .switch button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 9px;background:transparent;color:var(--ink-faint);border:1px solid var(--rule);cursor:pointer}
  .switch button[aria-pressed="true"]{color:var(--human);border-color:var(--human);background:var(--human-wash)}

  /* rail + stage */
  main{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0;align-items:start}
  @media (max-width:760px){ main{grid-template-columns:1fr} #rail{border-right:none;border-bottom:1px solid var(--rule)} }

  #rail{padding:18px 18px 40px;border-right:1px solid var(--rule);min-height:60vh}
  #rail h2{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 12px;font-weight:600}
  .settled{list-style:none;margin:0;padding:0}
  .settled li{position:relative;padding:0 0 12px 16px;font-size:13.5px;color:var(--ink-soft);
    border-left:1px solid var(--rule-soft);margin-left:3px}
  .settled li::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;
    background:var(--paper);border:1.5px solid var(--auto);border-radius:50%}
  .settled li b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:1px}
  .settled li.now::before{border-color:var(--human);background:var(--human)}
  .settled li.now{color:var(--ink)}
  .settled li.pending{opacity:.45}
  .settled li.pending::before{border-color:var(--rule);border-style:dashed}

  /* the card */
  #stage{padding:34px 34px 60px;max-width:760px}
  .station{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--human);margin-bottom:14px;display:flex;gap:10px;align-items:center}
  .station .dot{width:6px;height:6px;background:var(--human);border-radius:50%}
  .station .count{color:var(--ink-faint);margin-left:auto;letter-spacing:.08em}

  .card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--human);padding:26px 28px}
  .q{font-size:23px;line-height:1.32;margin:0 0 6px;letter-spacing:-.01em}
  .why{color:var(--ink-soft);font-size:14.5px;margin:0 0 22px}
  .why code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border:1px solid var(--rule-soft)}

  .opts{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);
    padding:13px 15px;cursor:pointer;font-family:var(--serif);font-size:15.5px;color:var(--ink);
    transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--human)}
  .opt .lab{display:flex;align-items:baseline;gap:9px}
  .opt .rec{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--human);border:1px solid var(--human);padding:1px 5px;white-space:nowrap}
  .opt .sub{display:block;color:var(--ink-faint);font-size:13.5px;margin-top:5px;line-height:1.45}
  .opt.recommended{border-left:3px solid var(--human);background:var(--human-wash)}

  .free{margin-bottom:16px}
  .free textarea{width:100%;min-height:104px;background:var(--paper);border:1px solid var(--rule);
    padding:12px 14px;font-family:var(--serif);font-size:15.5px;color:var(--ink);resize:vertical;line-height:1.5}
  .free textarea:focus{outline:none;border-color:var(--human)}
  .free textarea::placeholder{color:var(--ink-faint);font-style:italic}

  .escape{border-top:1px solid var(--rule-soft);padding-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .escape input{flex:1;min-width:180px;background:transparent;border:none;border-bottom:1px solid var(--rule);
    padding:6px 2px;font-family:var(--serif);font-size:15px;color:var(--ink)}
  .escape input:focus{outline:none;border-bottom-color:var(--human)}
  .escape input::placeholder{color:var(--ink-faint);font-style:italic}
  .send{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 16px;background:var(--ink);color:var(--paper);border:none;cursor:pointer}

  /* composing */
  .composing{display:flex;align-items:center;gap:11px;color:var(--ink-faint);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;padding:8px 0 2px}
  .composing .bar{display:inline-flex;gap:3px}
  .composing .bar i{width:3px;height:13px;background:var(--human);opacity:.28;animation:p 1.1s infinite}
  .composing .bar i:nth-child(2){animation-delay:.14s} .composing .bar i:nth-child(3){animation-delay:.28s}
  .composing .bar i:nth-child(4){animation-delay:.42s}
  @keyframes p{0%,100%{opacity:.22;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}
  .tool{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:12px;
    padding-left:12px;border-left:1px solid var(--rule-soft)}
  .tool span{color:var(--auto)}

  /* reattach */
  .card.reattach{border-left-color:var(--gate);background:var(--gate-wash)}
  .reattach .flag{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--gate);border:1px solid var(--gate);padding:2px 7px;display:inline-block;margin-bottom:16px}
  .reattach .lost{color:var(--ink-soft);font-size:14.5px;border-left:2px solid var(--gate);padding-left:12px;margin:16px 0 20px}
  .note{color:var(--ink-faint);font-size:12.5px;font-style:italic;margin-top:20px;padding-top:14px;border-top:1px solid var(--rule-soft)}
</style>

<header>
  <h1>Interview</h1>
  <span class="board">board/add-auth-a3f9</span>
  <div class="switch">
    <button data-s="options" aria-pressed="true">options</button>
    <button data-s="free" aria-pressed="false">free text</button>
    <button data-s="composing" aria-pressed="false">composing</button>
    <button data-s="reattach" aria-pressed="false">reattach</button>
  </div>
</header>

<main>
  <aside id="rail">
    <h2>Settled</h2>
    <ul class="settled" id="settled"></ul>
  </aside>
  <section id="stage"></section>
</main>

<script>
const SETTLED = [
  {k:"Scope",    v:"Session tokens only — refresh tokens are a later slice"},
  {k:"Storage",  v:"Postgres, alongside the existing users table"},
  {k:"Rotation", v:"On every privileged action, not on a timer"},
];

const STATES = {
  options: () => `
    <div class="station"><span class="dot"></span>01 · Specify<span class="count">question 4 of ~8</span></div>
    <div class="card">
      <h2 class="q">When a token is revoked, what happens to requests already in flight?</h2>
      <p class="why">Your glossary defines <code>revoke</code> as immediate, but the middleware
         checks the token once per request — so a long upload could outlive its own revocation.</p>
      <div class="opts">
        <button class="opt recommended">
          <span class="lab">Let them finish <span class="rec">recommended</span></span>
          <span class="sub">Simplest, and matches how the session middleware already works. A request
            that passed the check keeps its grant until it completes.</span>
        </button>
        <button class="opt">
          <span class="lab">Kill them mid-flight</span>
          <span class="sub">Strictly correct for a compromised token, but needs a revocation check
            at every I/O boundary and a way to abort a partial write.</span>
        </button>
        <button class="opt">
          <span class="lab">Let them finish, except for writes</span>
          <span class="sub">Splits the difference. Reads drain, writes abort — but "is this a write"
            becomes a judgement the middleware has to make.</span>
        </button>
      </div>
      <div class="escape">
        <input placeholder="Something else — say it in your own words…">
        <button class="send">Answer</button>
      </div>
    </div>
    <p class="note">One question at a time, because question 5 depends on this answer.</p>`,

  free: () => `
    <div class="station"><span class="dot"></span>01 · Specify<span class="count">question 5 of ~8</span></div>
    <div class="card">
      <h2 class="q">What should a user see when their session is revoked underneath them?</h2>
      <p class="why">There is no recommendation here — this is a product call, and the codebase
         has no precedent to lift from.</p>
      <div class="free">
        <textarea placeholder="However much or little you want — a sentence is fine…"></textarea>
      </div>
      <div class="escape">
        <span style="color:var(--ink-faint);font-size:13px;font-style:italic">
          Not sure? Say so, and it becomes an assumption in the spec.</span>
        <button class="send">Answer</button>
      </div>
    </div>`,

  composing: () => `
    <div class="station"><span class="dot"></span>01 · Specify<span class="count">question 6 of ~8</span></div>
    <div class="card">
      <div class="composing">
        <span class="bar"><i></i><i></i><i></i><i></i></span> reading the codebase
      </div>
      <div class="tool">grep <span>"revoke"</span> — 12 matches across 4 files<br>
           read <span>src/auth/middleware.ts</span></div>
      <p class="note">Facts get looked up, not asked. The next question arrives once it knows
        what the code already does.</p>
    </div>`,

  reattach: () => `
    <div class="station"><span class="dot"></span>01 · Specify<span class="count">question 5 of ~8</span></div>
    <div class="card reattach">
      <span class="flag">Reconnected</span>
      <h2 class="q">What should a user see when their session is revoked underneath them?</h2>
      <div class="lost">The server restarted while this question was open.
        If you answered it, that answer was <b>not recorded</b> — the question stands.</div>
      <div class="free">
        <textarea placeholder="However much or little you want…"></textarea>
      </div>
      <div class="escape">
        <span style="color:var(--ink-faint);font-size:13px;font-style:italic">
          Everything in the rail is safe — it was written to the ledger.</span>
        <button class="send">Answer</button>
      </div>
    </div>
    <p class="note">Never a silent resume: you should never have to wonder whether an answer landed.</p>`,
};

function render(state){
  const rail = SETTLED.map(s => `<li><b>${s.k}</b>${s.v}</li>`).join("")
    + `<li class="now"><b>Revocation</b>${state==="composing" ? "answered — next question composing" : "in flight"}</li>`
    + `<li class="pending"><b>Then</b>test seams, security surfaces…</li>`;
  document.getElementById("settled").innerHTML = rail;
  document.getElementById("stage").innerHTML = STATES[state]();
  document.querySelectorAll(".switch button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.s === state)));
}
document.querySelectorAll(".switch button").forEach(b =>
  b.addEventListener("click", () => render(b.dataset.s)));
render("options");
</script>
